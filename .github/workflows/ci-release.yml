name: CI & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # ---------------------------------------------------------------
  # CI: build + test on every push/PR
  # ---------------------------------------------------------------
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (egui/eframe needs glib, pkg-config, X11 libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglib2.0-dev libfontconfig1-dev libfreetype6-dev libxcb-composite0-dev libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render-util0-dev libxcb-shape0-dev libxcb-shm0-dev libxcb-util-dev libxcb-xfixes0-dev libxcb-xinerama0-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev libcurl4-openssl-dev libssl-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo registry/target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets

      - name: Run tests
        run: cargo test --all-targets

      - name: Build release binary (Opus included — rusty-opus, pure Rust, no CMake needed)
        run: cargo build --release

      - name: Show build artifacts
        run: ls -lh target/release/soundshared*

  # ---------------------------------------------------------------
  # Release: create GitHub release with binary assets + changelog
  # Runs only on push to main or on version tags
  # ---------------------------------------------------------------
  release:
    needs: ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies (egui/eframe needs glib, pkg-config, X11 libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglib2.0-dev libfontconfig1-dev libfreetype6-dev libxcb-composite0-dev libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render-util0-dev libxcb-shape0-dev libxcb-shm0-dev libxcb-util-dev libxcb-xfixes0-dev libxcb-xinerama0-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev libcurl4-openssl-dev libssl-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo registry/target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Build release binary (Opus included — rusty-opus, pure Rust, no CMake needed)
        run: cargo build --release

      - name: Strip binary (optional, reduces size)
        run: |
          if [ -f target/release/soundshared ]; then
            strip target/release/soundshared || true
          fi

      - name: Determine release tag and name
        id: release_vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="nightly-$(date +%Y%m%d)-$(git rev-parse --short HEAD)"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "name=Bardwave $TAG" >> $GITHUB_OUTPUT

      - name: Generate changelog from commits since last release
        id: changelog
        run: |
          if git describe --tags --abbrev=0 >/dev/null 2>&1; then
            PREV_TAG=$(git describe --tags --abbrev=0)
            LOG=$(git log --pretty=format:'- %s (%h)' "${PREV_TAG}..HEAD")
          else
            LOG=$(git log --pretty=format:'- %s (%h)' -n 20)
          fi
          echo "log<<EOF" >> $GITHUB_OUTPUT
          echo "${LOG}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_vars.outputs.tag }}
          release_name: ${{ steps.release_vars.outputs.name }}
          body: |
            ## Bardwave ${{ steps.release_vars.outputs.tag }}

            ### Изменения:
            ${{ steps.changelog.outputs.log }}

            ### Сборка:
            - Rust stable
            - Opus включён по умолчанию (rusty-opus, чистый Rust, CMake не требуется)
            - Запущено: `cargo build --release`
            - Проверки: `cargo fmt --check`, `cargo clippy`, `cargo test --all-targets`

            ### Файлы:
            - `soundshared` — релизный бинарник (Linux x86_64)
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: |
            target/release/soundshared

      - name: Upload release asset (binary)
        uses: softprops/action-gh-release@v2
        if: steps.create_release.outputs.id != ''
        with:
          tag_name: ${{ steps.release_vars.outputs.tag }}
          files: |
            target/release/soundshared
