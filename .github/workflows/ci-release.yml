name: CI / Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  ci:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglib2.0-dev libatk1.0-dev libatk-bridge2.0-dev \
            libfontconfig1-dev libfreetype6-dev libxcb-composite0-dev libxcb-icccm4-dev \
            libxcb-image0-dev libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render-util0-dev \
            libxcb-shape0-dev libxcb-shm0-dev libxcb-util-dev libxcb-xfixes0-dev \
            libxcb-xinerama0-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libcurl4-openssl-dev libssl-dev

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets

      - name: Run tests
        run: cargo test --all-targets

      - name: Build release
        run: cargo build --release

      - name: Show binary path
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "BINARY_PATH=target/release/soundshared.exe" >> $GITHUB_ENV
          else
            echo "BINARY_PATH=target/release/soundshared" >> $GITHUB_ENV
          fi

  release:
    name: Create Release
    needs: ci
    runs-on: windows-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: windows-cargo-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release

      - name: Get version
        id: version
        run: |
          $v = (Get-Content Cargo.toml -Raw) -match 'version = "([^"]+)"'
          $version = $matches[1]
          echo "VERSION=$version" >> $GITHUB_OUTPUT

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Bardwave v${{ steps.version.outputs.VERSION }}
          body: |
            ## Bardwave v${{ steps.version.outputs.VERSION }}

            Open-source TTRPG soundboard: desktop ambience console streamed to players' browsers over LAN.

            ### Assets
            - `soundshared.exe` — Windows release binary (x86_64-pc-windows-msvc)

            ### Changes
            See commit history for details.
          files: target/release/soundshared.exe
          draft: false
          prerelease: false
