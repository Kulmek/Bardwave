name: Release

# Publishes a GitHub release for the version in Cargo.toml whenever tag v<version> does not exist yet:
# - push to main: tests, builds Windows + Linux, creates the tag and publishes the release;
# - pull request: same builds when the version is new, without publishing;
# - manual run (Actions -> Release -> Run workflow): retry a release by hand.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.1.1 (must match Cargo.toml; tag v0.1.1 is created)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      build: ${{ steps.version.outputs.build }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve and validate version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION#v}"
          else
            version="$cargo_version"
          fi

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a version like 0.1.1"
            exit 1
          fi
          if [ "$version" != "$cargo_version" ]; then
            echo "::error::Version $version does not match Cargo.toml ($cargo_version). Bump Cargo.toml on main first."
            exit 1
          fi
          lock_version=$(grep -A1 '^name = "soundshared"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          if [ "$lock_version" != "$cargo_version" ]; then
            echo "::error::Cargo.lock has soundshared $lock_version, Cargo.toml has $cargo_version. Run 'cargo build' after bumping the version and commit Cargo.lock."
            exit 1
          fi

          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::error::Tag $tag already exists"
              exit 1
            fi
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$tag is already released; bump the version in Cargo.toml to publish a new one." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "build=true" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "New version $tag: building only, the release is published after merge to main." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Releasing $tag from $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
          # Oldest supported runner, so the binary runs on older glibc distros too.
          - name: linux-x86_64
            os: ubuntu-22.04
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libasound2-dev libxkbcommon-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Run tests
        run: cargo test --all-targets --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "Bardwave-$env:TAG-${{ matrix.name }}"
          New-Item -ItemType Directory -Path $dir | Out-Null
          Copy-Item target/release/soundshared.exe "$dir/Bardwave.exe"
          Copy-Item README.md, LICENSE $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
          "ASSET=$dir.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          dir="Bardwave-$TAG-${{ matrix.name }}"
          mkdir "$dir"
          cp target/release/soundshared "$dir/bardwave"
          cp README.md LICENSE "$dir/"
          tar -czf "$dir.tar.gz" "$dir"
          echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [ prepare, build ]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release and tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Bardwave ${{ needs.prepare.outputs.tag }}
          prerelease: ${{ inputs.prerelease || contains(needs.prepare.outputs.tag, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/*.tar.gz
