<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundShared Desktop App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Satoshi', sans-serif;
        }
    </style>
</head>
<body>
    <div class="flex flex-col h-screen bg-black text-gray-300 antialiased overflow-hidden">
        <!-- Title Bar -->
        <div class="h-8 flex items-center justify-between px-3 bg-[#141414] border-b border-[#2a2a2a] text-xs text-gray-400 shrink-0">
            <div class="flex items-center gap-2">
                <iconify-icon icon="lucide:radio" class="text-sm text-red-500"></iconify-icon>
                <span>SoundShared</span>
            </div>
            <div class="flex items-center gap-4 text-gray-500">
                <iconify-icon icon="lucide:minus" class="text-sm hover:text-gray-300 cursor-pointer"></iconify-icon>
                <iconify-icon icon="lucide:square" class="text-xs hover:text-gray-300 cursor-pointer"></iconify-icon>
                <iconify-icon icon="lucide:x" class="text-sm hover:text-red-400 cursor-pointer"></iconify-icon>
            </div>
        </div>

        <!-- Header -->
        <div class="h-14 flex items-center justify-between px-6 bg-[#141414] border-b border-[#2a2a2a] shrink-0 gap-6">
            <div class="flex items-center gap-3 shrink-0">
                <span class="text-xl font-bold text-white tracking-tight">SoundShared</span>
                <span class="text-sm text-gray-500">Audio Streaming Server</span>
            </div>
            <div class="flex items-center gap-3">
                <iconify-icon icon="lucide:volume-2" class="text-gray-400 text-base"></iconify-icon>
                <span class="text-sm text-gray-400">Master</span>
                <div class="w-28 h-1 bg-[#333] rounded-full relative">
                    <div class="h-full bg-red-600 rounded-full" style="width:80%"></div>
                </div>
                <div class="w-3.5 h-3.5 rounded-full border border-gray-500 shrink-0"></div>
                <span class="text-sm text-gray-400 w-9">80%</span>
            </div>
            <div class="flex items-center gap-2 text-sm text-gray-400 shrink-0">
                <span>Server: Stopped</span>
                <div class="w-2 h-2 rounded-full bg-gray-500"></div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex-1 bg-black p-6 overflow-hidden">
            <div class="flex flex-col md:flex-row gap-5 h-full items-start">
                <!-- Sound Library Panel -->
                <div class="w-full md:flex-1 bg-[#141414] border border-[#2a2a2a] rounded-md p-6">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-2xl font-bold text-white tracking-tight">Sound Library</h2>
                        <button class="flex items-center gap-2 bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-md text-sm font-medium transition-colors">
                            <iconify-icon icon="lucide:plus" class="text-base"></iconify-icon>
                            Add Sound
                        </button>
                    </div>
                    <div class="border-t border-[#2a2a2a] mb-10"></div>
                    <div class="flex flex-col items-center justify-center py-14 text-center">
                        <p class="text-gray-400 mb-1">No sounds loaded yet</p>
                        <p class="text-sm text-gray-600">Click "Add Sound" to load audio files</p>
                    </div>
                    <div class="border-t border-[#2a2a2a] mt-10 pt-4 flex items-center justify-between">
                        <div class="flex items-center gap-2 text-gray-300">
                            <iconify-icon icon="lucide:volume-2" class="text-base"></iconify-icon>
                            <span>Master Volume</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="text-gray-400 text-sm">%</span>
                            <input class="w-14 bg-[#2a2a2a] text-white text-center rounded-md py-1 text-sm border border-[#3a3a3a]" value="80">
                            <div class="w-3.5 h-3.5 rounded-full border border-gray-500"></div>
                        </div>
                    </div>
                </div>

                <!-- Network Server Panel -->
                <div class="w-full md:w-80 bg-[#141414] border border-[#2a2a2a] rounded-md p-6 shrink-0">
                    <h2 class="text-xl font-bold text-white mb-4 tracking-tight">Network Server</h2>
                    <div class="border-t border-[#2a2a2a] mb-5"></div>
                    <div class="flex items-center gap-2 mb-5">
                        <span class="text-gray-400 text-sm">Status:</span>
                        <div class="w-2 h-2 rounded-full bg-gray-500"></div>
                        <span class="text-white font-medium">Stopped</span>
                    </div>
                    <button class="flex items-center gap-2 bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-md text-sm font-medium transition-colors mb-6">
                        <iconify-icon icon="lucide:play" class="text-base"></iconify-icon>
                        Start Server
                    </button>
                    <div class="border-t border-[#2a2a2a] mb-5"></div>
                    <h3 class="text-center text-gray-300 mb-4">Configuration</h3>
                    <div class="mb-4">
                        <label class="text-sm text-gray-400 block mb-1">Port:</label>
                        <input class="w-24 bg-[#2a2a2a] text-white rounded-md px-3 py-1.5 text-sm border border-[#3a3a3a]" value="8080">
                    </div>
                    <div>
                        <label class="text-sm text-gray-400 block mb-1">Bind Address:</label>
                        <input class="w-full bg-[#2a2a2a] text-white rounded-md px-3 py-1.5 text-sm border border-[#3a3a3a]" value="0.0.0.0">
                    </div>
                </div>
            </div>
        </div>
    </div>
</body></html>
